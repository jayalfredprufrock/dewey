name: Release Action

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  release:
    name: Test, Build, Tag and Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: ".node-version"
          cache: true

      - name: Test
        run: vp check && vp exec tsgo --noEmit -p tsconfig.json && vp test
        env:
          DEWEY_OS_URL: http://localhost:9200

      - name: Build
        run: vp pack

      - name: Tag and Release
        run: vp exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
